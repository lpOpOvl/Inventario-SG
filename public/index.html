<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shadow Guardians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="loginPage">
  <div class="lw">
    <div class="lbrand">
      <div class="lbrand-icon"><img src="/sg-logo.png" alt="Shadow Guardians" style="width:52px;height:52px;object-fit:contain;display:block;"></div>
      <div><div class="lbrand-name">Shadow Guardians</div><div class="lbrand-sub">Inventário de Minérios</div></div>
    </div>
    <div class="lcard">
      <div class="atabs">
        <div class="atab active" id="tabL" onclick="showAuth('l')">Entrar</div>
        <div class="atab" id="tabR" onclick="showAuth('r')">Registar</div>
      </div>
      <div id="fL">
        <h2>Bem-vindo de volta</h2>
        <p class="lsub">Introduz as tuas credenciais para continuar.</p>
        <div class="lf"><label>Nickname</label><input type="text" id="lU" autocomplete="off" placeholder="O teu nickname"></div>
        <div class="lf"><label>Password</label><input type="password" id="lP" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar</button>
      </div>
      <div id="fR" style="display:none;">
        <h2>Criar conta</h2>
        <p class="lsub">Regista-te para aceder ao inventário da org.</p>
        <div class="lf"><label>Nickname</label><input type="text" id="rU" autocomplete="off" placeholder="O teu nickname no jogo"></div>
        <div class="lf"><label>Password</label><input type="password" id="rP" placeholder="Mínimo 4 caracteres"></div>
        <div class="lf"><label>Confirmar Password</label><input type="password" id="rP2" placeholder="Repete a password"></div>
        <div class="lf"><label>Código de Convite <span style="font-size:0.72rem;color:var(--muted);font-weight:400;">— não partilhes publicamente</span></label><input type="text" id="rC" autocomplete="off" placeholder="Pede a um membro da org"></div>
        <button class="btn btn-primary btn-full" onclick="doRegister()">Criar Conta</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/assets/auth.js"></script>
</body>
</html>
