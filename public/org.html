<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shadow Guardians — Inventário da Org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="dash">
  <aside class="sidebar">
    <div class="sb-header">
      <img src="/sg-logo.png" alt="Shadow Guardians" style="width:44px;height:44px;object-fit:contain;flex-shrink:0;">
      <div><div class="sb-name">Shadow Guardians</div><div class="sb-sub">Inventário de Minérios</div></div>
    </div>
    <nav class="sb-nav">
      <div class="sb-item" id="nav-inv" onclick="window.location.href='/dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/></svg>
        Meu Inventário
      </div>
      <div class="sb-item active" id="nav-org" onclick="window.location.href='/org.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Inventário da Org
      </div>
      <div class="sb-item" id="nav-obj" onclick="window.location.href='/objetivos.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Objetivos Minérios
      </div>
      <div class="sb-item" id="nav-objitems" onclick="window.location.href='/objitems.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        Objetivos Itens
      </div>
      <div class="sb-divider"></div>
      <div class="sb-item" id="nav-pw" onclick="window.location.href='/dashboard.html?section=pw'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Alterar Password
      </div>
      <div class="sb-item" id="nav-hist" onclick="window.location.href='/historico.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Histórico
      </div>
      <div class="sb-item" id="nav-rules" onclick="window.location.href='/regras.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Regras
      </div>
      <div class="sb-item admin-item" id="nav-admin" onclick="window.location.href='/admin.html'" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Administração
      </div>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span style="font-size:0.9rem;color:var(--muted);" id="tbTitle">Inventário da Org</span>
      <button class="user-btn" onclick="logout()">
        <div class="user-av" id="uAv">?</div>
        <span id="uName">—</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </button>
    </header>

    <div id="goalBanner">
      <div class="goal-banner-inner">
        <div class="goal-banner-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="goal-banner-text">
          <div class="goal-banner-title" id="goalBannerTitle">Meta atingida!</div>
          <div class="goal-banner-sep">·</div>
          <div class="goal-banner-items" id="goalBannerItems"></div>
        </div>
        <button class="goal-banner-close" onclick="document.getElementById('goalBanner').classList.remove('show')" title="Fechar">✕</button>
      </div>
    </div>

    <div class="content">
      <div class="content-inner">

        <div class="page-header">
          <h1 class="page-title" id="pgTitle">Inventário da Org</h1>
          <p class="page-sub" id="pgSub">Stock agregado de toda a organização</p>
        </div>

        <div class="stats-row" id="statsRow">
          <div class="sc" id="sc0"></div>
          <div class="sc" id="sc1"></div>
          <div class="sc" id="sc2"></div>
          <div class="sc" id="sc3"></div>
        </div>

        <div class="filter-row org" id="filterRowOrg" style="display:flex;">
          <div class="fg">
            <label>Filtrar por tipo</label>
            <select id="fTypeOrg" onchange="renderOrg()">
              <option value="">Todos os tipos</option>
              <option value="ship">Minério</option>
              <option value="gem">Gema</option>
            </select>
          </div>
          <div class="fg">
            <label>Localização</label>
            <select id="fLocOrg" onchange="renderOrg()">
              <option value="">Todas as localizações</option>
            </select>
          </div>
          <div class="fg">
            <label>Buscar item ou membro...</label>
            <input type="text" id="fSearchOrg" placeholder="Buscar item ou membro..." oninput="renderOrg()">
          </div>
        </div>

        <div id="addBtnRow" style="display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px;align-items:center;">
          <span style="font-size:0.78rem;color:var(--muted);" id="tblCount2"></span>
        </div>

        <div class="tbl-wrap" id="tblWrapOrg">
          <div id="tblContainerOrg"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- MODAL ADMIN EDIT ORG ITEM -->
<div class="modal-ov" id="mAdminEdit" style="display:none;" onclick="if(event.target.id==='mAdminEdit')document.getElementById('mAdminEdit').style.display='none'">
  <div class="modal-box">
    <h3>Editar Item</h3>
    <p class="modal-sub" id="mAEUser">—</p>
    <div class="fg2" style="margin-bottom:0;">
      <div class="ff">
        <label>Item</label>
        <select id="mAEName" onchange="updateAEUnit()">
          <optgroup label="Minérios Ship" id="mAEShipOpts"></optgroup>
          <optgroup label="Gemas (UND)" id="mAEGemOpts"></optgroup>
        </select>
      </div>
      <div class="ff">
        <label id="mAEQtyLabel">Quantidade (SCUs)</label>
        <input type="number" id="mAEQty" min="0.001" step="0.001">
      </div>
      <div class="ff">
        <label>Qualidade (900–1000)</label>
        <input type="number" id="mAEQual" min="900" max="1000" placeholder="900–1000">
      </div>
      <div class="ff s2">
        <label>Localização</label>
        <input type="text" id="mAELoc" placeholder="Localização">
      </div>
    </div>
    <div class="modal-acts">
      <button class="btn btn-success btn-sm" onclick="confirmAdminEdit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Guardar</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('mAdminEdit').style.display='none'">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/assets/shared.js"></script>
<script src="/assets/org.js"></script>
</body>
</html>
